name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test project page analytics
        run: node --test tests/pages.test.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: Notify IndexNow
    needs: deploy
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify IndexNow
        run: |
          test "$(curl --silent --show-error --fail \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "https://oneill9.github.io/function-keys/bd10d05365b4299fded10e708b9f932c.txt")" \
            = "bd10d05365b4299fded10e708b9f932c"
          curl --silent --show-error --fail-with-body \
            --request POST "https://api.indexnow.org/indexnow" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary '{
              "host": "oneill9.github.io",
              "key": "bd10d05365b4299fded10e708b9f932c",
              "keyLocation": "https://oneill9.github.io/function-keys/bd10d05365b4299fded10e708b9f932c.txt",
              "urlList": [
                "https://oneill9.github.io/function-keys/"
              ]
            }'
          echo "### IndexNow" >> "$GITHUB_STEP_SUMMARY"
          echo "Notified search engines of updated pages" >> "$GITHUB_STEP_SUMMARY"
